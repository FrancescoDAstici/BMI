<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolatore BMI</title>
  <link rel="stylesheet" href="foglioDiStileBMI.css">
</head>
<body>
  <div class="container">
    <h1>Calcolatore BMI</h1>

    <div class="card-box">
      <form  method="post" action="calcoloBMI.php">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Inserisci il tuo nome" required>
        </div>

        <div class="form-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" name="peso" placeholder="Es. 70" step="0.1" required>
        </div>

        <div class="form-group">
          <label for="altezza">Altezza (cm)</label>
          <input type="number" id="altezza" name="altezza" placeholder="Es. 175" required>
        </div>

        <button type="submit" class="submit-btn">Calcola BMI</button>
      </form>
    </div>
  </div>

</body>
</html>
